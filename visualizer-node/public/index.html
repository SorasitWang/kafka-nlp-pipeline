<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipeline Ops Visualizer</title>
<style>
  :root {
    color-scheme: light;
    --surface-page:   #f9f9f7;
    --surface-card:   #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --border:         rgba(11,11,11,0.10);
    --gridline:       #e1e0d9;
    --seq-400:        #3987e5;
    --seq-500:        #256abf;
    --seq-100:        #cde2fb;
    --status-good:      #0ca30c;
    --status-warning:   #fab219;
    --status-serious:   #ec835a;
    --status-critical:  #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-page:   #0d0d0d;
      --surface-card:   #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --border:         rgba(255,255,255,0.10);
      --gridline:       #2c2c2a;
      --seq-400:        #3987e5;
      --seq-500:        #6da7ec;
      --seq-100:        #184f95;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 3rem;
    background: var(--surface-page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.2rem; }
  .subtitle { color: var(--text-secondary); font-size: 0.85rem; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem; margin-bottom: 1.5rem; }
  #meta { color: var(--text-muted); font-size: 0.8rem; text-align: right; }
  #meta.stale { color: var(--status-critical); }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.75rem;
  }
  .tile {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
  }
  .tile .label { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .tile .value { font-size: 1.7rem; font-weight: 600; margin-top: 0.15rem; }
  .tile .unit { font-size: 0.85rem; font-weight: 400; color: var(--text-secondary); margin-left: 0.25rem; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem 1.1rem;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
  .card-head h2 { font-size: 1rem; margin: 0; }

  .pill {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.15rem 0.55rem; border-radius: 999px;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid var(--border);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .pill.busy { color: var(--status-good); }
  .pill.busy .dot { background: var(--status-good); }
  .pill.idle { color: var(--text-secondary); }
  .pill.idle .dot { background: var(--text-muted); }
  .pill.down { color: var(--status-critical); }
  .pill.down .dot { background: var(--status-critical); }

  .queue-value { display: flex; align-items: baseline; gap: 0.35rem; margin: 0.3rem 0 0.35rem; }
  .queue-value .n { font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .queue-value .label { color: var(--text-secondary); font-size: 0.78rem; }

  .meter-track {
    height: 8px; border-radius: 4px; background: var(--seq-100);
    overflow: hidden; margin-bottom: 0.6rem;
  }
  .meter-fill { height: 100%; background: var(--seq-400); border-radius: 4px; transition: width 0.4s ease; }

  .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary); margin: 0.25rem 0; }
  .stat-row strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .sparkline { display: block; margin-top: 0.5rem; }
  .sparkline path { fill: none; stroke: var(--seq-500); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .partitions { margin-top: 0.6rem; font-size: 0.75rem; color: var(--text-muted); }

  #errorBanner {
    display: none;
    background: var(--status-critical); color: #fff;
    padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div id="errorBanner"></div>
  <header>
    <div>
      <h1>Pipeline Ops Visualizer</h1>
      <div class="subtitle">Kafka consumer lag &amp; service busy status — separate from the results dashboard</div>
    </div>
    <div id="meta">connecting…</div>
  </header>

  <section class="kpi-row" id="kpiRow"></section>
  <section class="cards" id="cards"></section>

  <script src="app.js"></script>
</body>
</html>
