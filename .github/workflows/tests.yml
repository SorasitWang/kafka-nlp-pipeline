name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consumers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumers-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the libraries the delivery logic imports; the NLP models aren't needed for these tests.
      - run: pip install confluent-kafka psycopg2-binary python-dotenv pytest
      - run: pytest tests -v

  producer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: producer-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: producer-go/go.mod
      - run: go vet ./...
      - run: go build ./...
